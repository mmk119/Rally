name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # lets you redeploy from the Actions tab without pushing a commit,
  # which is how you pick up a rotated API key
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push supersedes an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Vite inlines VITE_* variables into the client bundle at build time.
          # Keeping the key in a repository secret keeps it out of git history,
          # but it IS readable in the deployed JavaScript — treat this key as
          # public, scope it tightly, and set a spend limit on it.
          # If the secret is unset the build still succeeds and Coach falls back
          # to its offline keyword parser, so the site never ships broken.
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
